<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Real Kaj</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 560px;
    width: 100%;
    margin-top: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; font-size: 24px; color: #333; margin-bottom: 8px; }
  p.sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
  input[type="url"] {
    width: 100%;
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  input[type="url"]:focus { border-color: #764ba2; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    color: #d33;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .error.show { display: block; }
  ##resultList {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.linkRow {
  display: grid;
  grid-template-columns: 25px 82px 72px 1fr;
  align-items: center;
  gap: 8px;
  background: #f5f5fa;
  border-radius: 10px;
  padding: 10px 12px;
}

.linkRow .num {
  font-size: 13px;
  font-weight: 700;
  color: #aaa;
  min-width: 0;
}

.linkRow .linkText {
  grid-column: 4;
  grid-row: 1;
  font-size: 14px;
  font-weight: 600;
  color: #764ba2;
  word-break: break-all;
  min-width: 0;
}

/* Copy button সব row-তে একই left position-এ */
.linkRow .copyBtn {
  grid-column: 2;
  grid-row: 1;
  width: 82px;
  margin-top: 0;
  padding: 14px 8px;
  font-size: 16px;
  font-weight: 600;
  background: #333;
  white-space: nowrap;
  border-radius: 8px;
}

/* Copied-ও Copy button-এর ঠিক পাশে থাকবে */
.linkRow .copiedLabel {
  grid-column: 3;
  grid-row: 1;
  color: #d33;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  display: none;
}

.linkRow .copiedLabel.show {
  display: inline;
}

.progress {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-top: 14px;
  display: none;
}

.progress.show {
  display: block;
}
</style>
</head>
<body>

<div class="card">
  <h1>🔗 Link Shortener</h1>
  <p class="sub">Ekta long link diye 10ta short link ekshathe banan</p>

  <input type="url" id="longUrl" placeholder="https://example.com/your-long-link" required>
  <button id="shortenBtn" onclick="shortenLink()">10ta Short Link Banao</button>

  <div class="error" id="errorBox"></div>
  <div class="progress" id="progressBox"></div>

  <div id="resultList"></div>
</div>

<script>
const COPY_TEMPLATE = `⚠️কোনো রেফার লাগবেনা টাকা তুলতে। 
কোনো টাকাও ইনভেস্ট করতে হয়না এখানে।মানে সম্পুর্ন ফ্রিতে কাজ করে টাকা তোলা যায়। 
⚠️১০০% পেমেন্ট ভেরিফাইড সাইট।
কষ্ট করে রেফার করতে হয়না তাই একবার চেক করে দেখতে পারেন।কাজের বিস্তারিত জানতে ইনবক্সে আসার দরকার নেই নিচের লিংকে গেলেই সব বিস্তারিত পেয়ে যাবেন

লিংকঃ  `;
// Firebase Realtime Database URL
const FIREBASE_DB_URL = "https://shortlink-sammi-default-rtdb.asia-southeast1.firebasedatabase.app";

function generateCode(length = 6) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let code = "";
  for (let i = 0; i < length; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function isValidUrl(str) {
  try {
    const u = new URL(str);
    return u.protocol === "http:" || u.protocol === "https:";
  } catch {
    return false;
  }
}

async function codeExists(code) {
  const res = await fetch(`${FIREBASE_DB_URL}/links/${code}.json`);
  const data = await res.json();
  return data !== null;
}

async function createOneShortLink(longUrl) {
  let code = generateCode();
  let tries = 0;
  while (await codeExists(code) && tries < 5) {
    code = generateCode();
    tries++;
  }

  const saveRes = await fetch(`${FIREBASE_DB_URL}/links/${code}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      url: longUrl,
      created: Date.now(),
      clicks: 0
    })
  });

  if (!saveRes.ok) throw new Error("Save failed");

  return `${window.location.origin}/${code}`;
}

async function shortenLink() {
  const btn = document.getElementById("shortenBtn");
  const input = document.getElementById("longUrl");
  const errorBox = document.getElementById("errorBox");
  const progressBox = document.getElementById("progressBox");
  const resultList = document.getElementById("resultList");
  const longUrl = input.value.trim();

  errorBox.classList.remove("show");
  resultList.innerHTML = ""; // age jeta chilo shob mucche dilo (refresh na kore o notun generate korle replace hoy)

  if (!isValidUrl(longUrl)) {
    errorBox.textContent = "Sothik URL din (http:// othoba https:// diye shuru hote hobe)";
    errorBox.classList.add("show");
    return;
  }

  btn.disabled = true;
  progressBox.classList.add("show");

  try {
    for (let i = 1; i <= 10; i++) {
      progressBox.textContent = `Banano hocche... (${i}/10)`;
      const shortLink = await createOneShortLink(longUrl);
      addLinkRow(i, shortLink);
    }
    progressBox.textContent = "Sob koyta link toiri hoye geche!";
    setTimeout(() => progressBox.classList.remove("show"), 2000);
  } catch (err) {
    errorBox.textContent = "Kichu vul hoyeche, abar try korun";
    errorBox.classList.add("show");
    progressBox.classList.remove("show");
  } finally {
    btn.disabled = false;
  }
}

function addLinkRow(num, link) {
  const resultList = document.getElementById("resultList");

  // Copy হবে পুরো message
  const fullMessage = COPY_TEMPLATE + link;

  const row = document.createElement("div");
  row.className = "linkRow";

  row.innerHTML = `
    <span class="num">${num}.</span>
    <span class="linkText">${link}</span>
    <button class="copyBtn">Copy</button>
    <span class="copiedLabel">✓ Copied</span>
  `;

  const btn = row.querySelector(".copyBtn");

  btn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(fullMessage);

    const label = btn.nextElementSibling;
    label.classList.add("show");

  } catch (err) {
    alert("Copy failed!");
  }
});

  resultList.appendChild(row);
}
</script>



<script>


(async () => {

    const path = location.pathname.replace(/^\/+/,"");

    // Home page
    if(path==="" || path==="index.html") return;

    // Static file ignore
    if(path.includes(".")) return;

    const ua=(navigator.userAgent||"").toLowerCase();

    const isCrawler=
        ua.includes("facebookexternalhit")||
        ua.includes("facebot")||
        ua.includes("telegrambot")||
        ua.includes("twitterbot")||
        ua.includes("xbot")||
        ua.includes("linkedinbot")||
        ua.includes("slackbot")||
        ua.includes("discordbot")||
        ua.includes("whatsapp")||
        ua.includes("skypeuripreview")||
        ua.includes("applebot");

    // Bot হলে কিছুই করবে না
    if(isCrawler){
        document.body.innerHTML="";
        return;
    }

    try{

        const res=await fetch(`${FIREBASE_DB_URL}/links/${path}.json`);
        const data=await res.json();

        if(data && data.url){

            fetch(`${FIREBASE_DB_URL}/links/${path}/clicks.json`,{
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify((data.clicks||0)+1)
            });

            location.replace(data.url);
            return;
        }

    }catch(e){}

    document.body.innerHTML=`
    <div style="
    font-family:Arial;
    text-align:center;
    margin-top:80px;">
    <h2>404</h2>
    <p>Short link not found.</p>
    </div>`;
})();
</script>
</body>
</html>
