<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অনলাইন জব এড ফি ছাড়া</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #fff;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 0;
    margin: 0;
  }
  .card {
    background: #fff;
    border-radius: 0;
    padding: 24px 22px 12px;
    max-width: none;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    box-shadow: none;
    display: flex;
    flex-direction: column;
  }
  h1 { text-align: center; font-size: 24px; color: #333; margin-bottom: 8px; }
  p.sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
  .error { color:#d33; font-size:13px; margin-top:12px; text-align:center; display:none; }
  .error.show { display:block; }
  #resultList {
    margin-top:22px;
    display:flex;
    flex:1;
    min-height:0;
    flex-direction:column;
    gap:9px;
    padding-bottom:0;
  }
  .linkRow {
    display:flex;
    flex:1 1 0;
    min-height:0;
    align-items:center;
    flex-wrap:nowrap;
    gap:10px;
    background:#f5f5fa;
    border-radius:10px;
    padding:12px 14px;
  }
  .linkRow .num { order:3; font-size:13px; font-weight:700; color:#aaa; min-width:22px; flex-shrink:0; }
  .linkRow .linkText { order:4; flex:1; min-width:0; font-size:14px; font-weight:600; color:#764ba2; word-break:break-all; }
  .linkRow .copyBtn { order:2; width:auto; margin:0; padding:10px 16px; border:0; border-radius:8px; background:#333; color:#fff; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .linkRow .copiedLabel { order:1; color:#159447; font-size:12px; font-weight:700; white-space:nowrap; display:none; }
  .linkRow .copiedLabel.show { display:inline; }
  .status { text-align:center; color:#888; font-size:13px; margin-top:14px; }
  @media(max-width:380px) {
    .card { padding:24px 14px 10px; }
    .linkRow { gap:7px; padding:10px; }
    .linkRow .copyBtn { padding:9px 11px; }
    .linkRow .linkText { font-size:12px; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔗 Short Link List</h1>
  <p class="sub">প্রতিবার সাইটে প্রবেশ বা Refresh করলে নতুন ১০টি লিংক তৈরি হবে</p>
  <div class="status" id="progressBox">নতুন লিংক তৈরি হচ্ছে...</div>
  <div class="error" id="errorBox"></div>
  <div id="resultList"></div>
</div>

<script>
const FIXED_TARGET_URL = "https://t.me/takardorjabot";
const LINKS_PER_VISIT = 10;
const FIREBASE_DB_URL = "https://shortlink-sammi-default-rtdb.asia-southeast1.firebasedatabase.app";

function generateCode(length = 7) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => chars[b % chars.length]).join("");
}

async function createOneShortLink(targetUrl) {
  for (let attempt = 0; attempt < 12; attempt++) {
    const code = generateCode();
    const check = await fetch(`${FIREBASE_DB_URL}/links/${code}.json`, { cache: "no-store" });
    if (!check.ok) throw new Error("Firebase read failed");
    if ((await check.json()) !== null) continue;

    const saveRes = await fetch(`${FIREBASE_DB_URL}/links/${code}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: targetUrl, created: Date.now(), clicks: 0 })
    });
    if (!saveRes.ok) throw new Error("Firebase save failed");
    return `${window.location.origin}/${code}`;
  }
  throw new Error("Unique link code could not be generated");
}

function addLinkRow(num, link) {
  const resultList = document.getElementById("resultList");
  const row = document.createElement("div");
  row.className = "linkRow";

  const number = document.createElement("span");
  number.className = "num";
  number.textContent = `${num}.`;

  const linkText = document.createElement("span");
  linkText.className = "linkText";
  linkText.textContent = link;

  const copied = document.createElement("span");
  copied.className = "copiedLabel";
  copied.textContent = "✓ Copied";

  const copyBtn = document.createElement("button");
  copyBtn.className = "copyBtn";
  copyBtn.type = "button";
  copyBtn.textContent = "Copy";
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(link);
      copied.classList.add("show");
      copyBtn.textContent = "Copied";
    } catch (_) {
      const area = document.createElement("textarea");
      area.value = link;
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (ok) { copied.classList.add("show"); copyBtn.textContent = "Copied"; }
      else alert("Copy করা যায়নি। লিংকটি long-press করে কপি করুন।");
    }
  });

  // আগের ডিজাইনের মতো Copy Button বাম পাশে থাকবে।
  row.append(copied, copyBtn, number, linkText);
  resultList.appendChild(row);
}

async function generateLinksOnVisit() {
  const progress = document.getElementById("progressBox");
  const errorBox = document.getElementById("errorBox");
  const resultList = document.getElementById("resultList");
  resultList.replaceChildren();
  errorBox.classList.remove("show");

  try {
    for (let i = 1; i <= LINKS_PER_VISIT; i++) {
      progress.textContent = `লিংক তৈরি হচ্ছে... (${i}/${LINKS_PER_VISIT})`;
      const shortLink = await createOneShortLink(FIXED_TARGET_URL);
      addLinkRow(i, shortLink);
    }
    progress.textContent = "১০টি নতুন লিংক তৈরি হয়েছে।";
  } catch (err) {
    console.error(err);
    progress.textContent = "";
    errorBox.textContent = "লিংক তৈরি হয়নি। Firebase Database Rules ও ইন্টারনেট সংযোগ পরীক্ষা করুন, তারপর Refresh দিন।";
    errorBox.classList.add("show");
  }
}

document.addEventListener("DOMContentLoaded", generateLinksOnVisit);
</script>

<script>
(async () => {
  const path = location.pathname.replace(/^\/+/, "");

  if (path === "" || path === "index.html") return;
  if (path.includes(".")) return;

  const ua = (navigator.userAgent || "").toLowerCase();

  const isCrawler =
    ua.includes("facebookexternalhit") ||
    ua.includes("facebot") ||
    ua.includes("telegrambot") ||
    ua.includes("twitterbot") ||
    ua.includes("xbot") ||
    ua.includes("linkedinbot") ||
    ua.includes("slackbot") ||
    ua.includes("discordbot") ||
    ua.includes("whatsapp") ||
    ua.includes("skypeuripreview") ||
    ua.includes("applebot");

  if (isCrawler) {
    document.body.innerHTML = "";
    return;
  }

  try {
    const res = await fetch(`${FIREBASE_DB_URL}/links/${path}.json`);
    const data = await res.json();

    if (data && data.url) {
      fetch(`${FIREBASE_DB_URL}/links/${path}/clicks.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify((data.clicks || 0) + 1)
      });

      location.replace(data.url);
      return;
    }
  } catch (e) {}

  document.body.innerHTML = `
    <div style="font-family:Arial; text-align:center; margin-top:80px;">
      <h2>404</h2>
      <p>Short link not found.</p>
    </div>`;
})();
</script>

</body>
</html>
