<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Real Kaj</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 560px;
    width: 100%;
    margin-top: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; font-size: 24px; color: #333; margin-bottom: 8px; }
  p.sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
  input[type="url"] {
    width: 100%;
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  input[type="url"]:focus { border-color: #764ba2; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    color: #d33;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .error.show { display: block; }
  #resultList {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .linkRow {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 10px;
    background: #f5f5fa;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .linkRow .num {
    font-size: 13px;
    font-weight: 700;
    color: #aaa;
    min-width: 20px;
    flex-shrink: 0;
  }
  .linkRow .linkText {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: #764ba2;
    word-break: break-all;
  }
  .linkRow .copiedLabel {
    color: #d33;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
    display: none;
    order: 1;
  }
  .linkRow .copiedLabel.show { display: inline; }
  .linkRow .copyBtn {
    width: auto;
    margin-top: 0;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    background: #333;
    white-space: nowrap;
    border-radius: 8px;
    flex-shrink: 0;
    order: 2;
  }
  .progress {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-top: 14px;
    display: none;
  }
  .progress.show { display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>🔗 Link Shortener</h1>
  <p class="sub">Ekta long link diye 10ta short link ekshathe banan</p>

  <input type="url" id="longUrl" placeholder="https://example.com/your-long-link" required>
  <button id="shortenBtn" onclick="shortenLink()">10ta Short Link Banao</button>

  <div class="error" id="errorBox"></div>
  <div class="progress" id="progressBox"></div>

  <div id="resultList"></div>
</div>

<script>
const COPY_TEMPLATE = `⚠️কোনো রেফার লাগবেনা টাকা তুলতে।   
কোনো টাকাও ইনভেস্ট করতে হয়না এখানে।মানে সম্পুর্ন ফ্রিতে কাজ করে টাকা তোলা যায়।   
⚠️১০০% পেমেন্ট ভেরিফাইড সাইট।  
কষ্ট করে রেফার করতে হয়না তাই একবার চেক করে দেখতে পারেন।কাজের বিস্তারিত জানতে ইনবক্সে আসার দরকার নেই নিচের লিংকে গেলেই সব বিস্তারিত পেয়ে যাবেন  
  
লিংকঃ  `;

const FIREBASE_DB_URL = "https://shortlink-sammi-default-rtdb.asia-southeast1.firebasedatabase.app";

function generateCode(length = 6) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let code = "";
  for (let i = 0; i < length; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function isValidUrl(str) {
  try {
    const u = new URL(str);
    return u.protocol === "http:" || u.protocol === "https:";
  } catch {
    return false;
  }
}

async function codeExists(code) {
  const res = await fetch(`${FIREBASE_DB_URL}/links/${code}.json`);
  const data = await res.json();
  return data !== null;
}

async function createOneShortLink(longUrl) {
  let code = generateCode();
  let tries = 0;
  while (await codeExists(code) && tries < 5) {
    code = generateCode();
    tries++;
  }

  const saveRes = await fetch(`${FIREBASE_DB_URL}/links/${code}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      url: longUrl,
      created: Date.now(),
      clicks: 0
    })
  });

  if (!saveRes.ok) throw new Error("Save failed");

  return `${window.location.origin}/${code}`;
}

async function shortenLink() {
  const btn = document.getElementById("shortenBtn");
  const input = document.getElementById("longUrl");
  const errorBox = document.getElementById("errorBox");
  const progressBox = document.getElementById("progressBox");
  const resultList = document.getElementById("resultList");
  const longUrl = input.value.trim();

  errorBox.classList.remove("show");
  resultList.innerHTML = "";

  if (!isValidUrl(longUrl)) {
    errorBox.textContent = "Sothik URL din (http:// othoba https:// diye shuru hote hobe)";
    errorBox.classList.add("show");
    return;
  }

  btn.disabled = true;
  progressBox.classList.add("show");

  try {
    for (let i = 1; i <= 10; i++) {
      progressBox.textContent = `Banano hocche... (${i}/10)`;
      const shortLink = await createOneShortLink(longUrl);
      addLinkRow(i, shortLink);
    }
    progressBox.textContent = "Sob koyta link toiri hoye geche!";
    setTimeout(() => progressBox.classList.remove("show"), 2000);
  } catch (err) {
    errorBox.textContent = "Kichu vul hoyeche, abar try korun";
    errorBox.classList.add("show");
    progressBox.classList.remove("show");
  } finally {
    btn.disabled = false;
  }
}

function addLinkRow(num, link) {
  const resultList = document.getElementById("resultList");
  const fullMessage = COPY_TEMPLATE + link;

  const row = document.createElement("div");
  row.className = "linkRow";

  // Visual order: [Copied] [Copy] [num] [link]
  // copiedLabel(order:1) copyBtn(order:2) num(order:3) linkText(order:4)
  row.innerHTML = `
    <span class="copiedLabel">✓ Copied</span>
    <button class="copyBtn">Copy</button>
    <span class="num" style="order:3;">${num}.</span>
    <span class="linkText" style="order:4;">${link}</span>
  `;

  const copyBtn = row.querySelector(".copyBtn");
  const copiedLabel = row.querySelector(".copiedLabel");

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(fullMessage);
      copiedLabel.classList.add("show");
    } catch (err) {
      alert("Copy failed!");
    }
  });

  resultList.appendChild(row);
}
</script>

<script>
(async () => {
  const path = location.pathname.replace(/^\/+/, "");

  if (path === "" || path === "index.html") return;
  if (path.includes(".")) return;

  const ua = (navigator.userAgent || "").toLowerCase();

  const isCrawler =
    ua.includes("facebookexternalhit") ||
    ua.includes("facebot") ||
    ua.includes("telegrambot") ||
    ua.includes("twitterbot") ||
    ua.includes("xbot") ||
    ua.includes("linkedinbot") ||
    ua.includes("slackbot") ||
    ua.includes("discordbot") ||
    ua.includes("whatsapp") ||
    ua.includes("skypeuripreview") ||
    ua.includes("applebot");

  if (isCrawler) {
    document.body.innerHTML = "";
    return;
  }

  try {
    const res = await fetch(`${FIREBASE_DB_URL}/links/${path}.json`);
    const data = await res.json();

    if (data && data.url) {
      fetch(`${FIREBASE_DB_URL}/links/${path}/clicks.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify((data.clicks || 0) + 1)
      });

      location.replace(data.url);
      return;
    }
  } catch (e) {}

  document.body.innerHTML = `
    <div style="font-family:Arial; text-align:center; margin-top:80px;">
      <h2>404</h2>
      <p>Short link not found.</p>
    </div>`;
})();
</script>

</body>
</html>
